<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Utama - SPENFORTY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Transisi timer agar halus */
    #timerBar { transition: width linear; }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-6 flex flex-col items-center">

  <!-- Header dengan Logo -->
  <div class="flex flex-col items-center mb-6 text-center">
    <img src="https://smpnegeri40suroboyo.wordpress.com/wp-content/uploads/2020/06/cropped-cilik-web.png" alt="Logo Spenforty" class="h-24 mb-4 drop-shadow-md">
    <h1 class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider">
      LIVE TANTANGAN MATEMATIKA SPENFORTY
    </h1>
    <h2 class="mt-2 text-xl text-slate-300">Kode Room: <span id="roomCodeDisplay" class="text-amber-400 font-bold text-2xl">-</span></h2>
  </div>

  <button id="startBtn" onclick="startQuiz()" class="mb-8 bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-full text-xl font-bold shadow-[0_0_15px_rgba(34,197,94,0.5)] transition-all transform hover:scale-105">
    ▶ MULAI KUIS (OTOMATIS)
  </button>

  <!-- Container Utama -->
  <div class="w-full max-w-6xl flex flex-col md:flex-row gap-6">
    
    <!-- Box Kiri: Layar Soal -->
    <div class="flex-2 w-full md:w-2/3 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl flex flex-col relative overflow-hidden">
      
      <div class="flex justify-between items-center mb-4">
        <div id="categoryBadge" class="bg-cyan-600 text-white px-4 py-1 rounded-full text-sm font-bold tracking-wide uppercase">
          MENUNGGU MULAI
        </div>
      </div>

      <!-- Timer Bar -->
      <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden mb-6">
        <div id="timerBar" class="h-full bg-green-400 w-full rounded-full"></div>
      </div>

      <!-- Teks Soal -->
      <div class="flex-1 flex items-center justify-center bg-slate-950 border-2 border-cyan-500/50 rounded-xl p-8 mb-6 shadow-inner">
        <h2 id="questionBox" class="text-6xl md:text-8xl font-black text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">
          SIAP?
        </h2>
      </div>
      
      <!-- Box Penjawab Tercepat -->
      <div class="bg-indigo-950/50 border border-indigo-500/50 rounded-xl p-4 text-center">
        <div class="text-indigo-300 text-sm font-bold uppercase tracking-widest mb-1">⚡ Tercepat & Benar</div>
        <div class="text-2xl text-white font-bold">
          <span id="fastestName">-</span> 
          <span id="fastestTime" class="text-amber-400 text-lg ml-2">(-)</span>
        </div>
      </div>
    </div>

    <!-- Box Kanan: Klasemen -->
    <div class="flex-1 w-full md:w-1/3 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
      <h3 class="text-amber-400 font-extrabold text-xl mb-4 flex items-center gap-2 border-b border-slate-700 pb-3">
        🏆 KLASEMEN (TOP 10)
      </h3>
      <ol id="leaderboardList" class="flex flex-col gap-3">
        <li class="text-slate-400 text-center italic mt-4">Belum ada data</li>
      </ol>
    </div>
  </div>

  <script>
    const socket = io();
    const roomId = "MATH123";

    socket.emit('create_room', roomId);
    document.getElementById('roomCodeDisplay').innerText = roomId;

    function startQuiz() {
      document.getElementById('startBtn').style.display = 'none';
      socket.emit('start_question', roomId);
    }

    socket.on('new_question', (data) => {
      document.getElementById('questionBox').innerText = data.questionText;
      document.getElementById('categoryBadge').innerText = `${data.category} (${data.duration}s)`;
      document.getElementById('fastestName').innerText = "Menunggu jawaban...";
      document.getElementById('fastestTime').innerText = "-";

      const bar = document.getElementById('timerBar');
      bar.style.transition = 'none';
      bar.style.width = '100%';

      setTimeout(() => {
        bar.style.transition = `width ${data.duration}s linear`;
        bar.style.width = '0%';
      }, 50);
    });

    socket.on('round_results', (data) => {
      document.getElementById('fastestName').innerText = data.fastestName;
      document.getElementById('fastestTime').innerText = data.fastestTime;
      
      document.getElementById('categoryBadge').innerText = "⏳ Bersiap... Soal berikutnya dalam 5 detik!";
      document.getElementById('questionBox').innerText = `Jawaban: ${data.correctAnswer}`;

      const list = document.getElementById('leaderboardList');
      list.innerHTML = '';
      data.leaderboard.forEach((player, idx) => {
        // Efek warna emas untuk juara 1
        const isFirst = idx === 0 ? 'text-amber-400 font-bold text-lg' : 'text-slate-200';
        list.innerHTML += `
          <li class="flex justify-between items-center bg-slate-700/50 p-3 rounded-lg border border-slate-600/50">
            <span class="${isFirst}">${idx + 1}. ${player.name}</span>
            <strong class="${isFirst} bg-slate-800 px-3 py-1 rounded-md">${player.score} p</strong>
          </li>
        `;
      });
    });
  </script>
</body>
</html>
