<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Utama - SPENFORTY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pusher CDN -->
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <style>
    /* Transisi timer & animasi perubahan orientasi layar */
    #timerBar { transition: width linear; }
    .smooth-layout {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tata Letak Potret (Default / Layar HP & Tablet Berdiri) */
    .main-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }
    .question-box-container {
      order: 1;
      width: 100%;
    }
    .leaderboards-wrapper {
      order: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      width: 100%;
    }

    /* Tata Letak Lanskap (Layar Laptop, Proyektor & HP Miring) */
    @media (orientation: landscape) and (min-width: 640px) {
      .main-container {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 1.5rem;
      }
      .question-box-container {
        order: 2;
      }
      .leaderboards-wrapper {
        display: contents; /* Menjadikan elemen anak langsung terhubung ke grid utama */
      }
      .fastest-container {
        order: 1;
      }
      .topscore-container {
        order: 3;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-4 sm:p-6 flex flex-col items-center">

  <!-- Header dengan Logo -->
  <div class="flex flex-col items-center mb-4 text-center">
    <img src="https://smpnegeri40suroboyo.wordpress.com/wp-content/uploads/2020/06/cropped-cilik-web.png" alt="Logo Spenforty" class="h-20 sm:h-24 mb-2 drop-shadow-md">
    <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider">
      LIVE TANTANGAN MATEMATIKA SPENFORTY
    </h1>
    <h2 class="mt-1 text-lg sm:text-xl text-slate-300">Kode Room: <span id="roomCodeDisplay" class="text-amber-400 font-bold text-2xl">-</span></h2>
  </div>

  <button id="startBtn" onclick="startQuiz()" class="mb-6 bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-full text-xl font-bold shadow-[0_0_15px_rgba(34,197,94,0.5)] transition-all transform hover:scale-105">
    ▶ MULAI KUIS (OTOMATIS)
  </button>

  <!-- Container Utama Layout -->
  <div class="main-container smooth-layout max-w-7xl">
    
    <!-- Kotak Soal (Tengah di Lanskap / Atas di Potret) -->
    <div class="question-box-container smooth-layout bg-slate-800 border border-slate-700 rounded-2xl p-5 sm:p-6 shadow-2xl flex flex-col relative overflow-hidden">
      
      <div class="flex justify-between items-center mb-4">
        <div id="categoryBadge" class="bg-cyan-600 text-white px-4 py-1 rounded-full text-xs sm:text-sm font-bold tracking-wide uppercase">
          MENUNGGU MULAI
        </div>
      </div>

      <!-- Timer Bar -->
      <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden mb-6">
        <div id="timerBar" class="h-full bg-green-400 w-full rounded-full"></div>
      </div>

      <!-- Teks Soal -->
      <div class="flex-1 min-h-[160px] flex items-center justify-center bg-slate-950 border-2 border-cyan-500/50 rounded-xl p-6 mb-6 shadow-inner">
        <h2 id="questionBox" class="text-4xl sm:text-6xl md:text-7xl font-black text-white text-center drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">
          SIAP?
        </h2>
      </div>
      
      <!-- Box Penjawab Tercepat Ronde Ini -->
      <div class="bg-indigo-950/50 border border-indigo-500/50 rounded-xl p-3 text-center">
        <div class="text-indigo-300 text-xs font-bold uppercase tracking-widest mb-0.5">⚡ Tercepat Ronde Ini</div>
        <div class="text-lg sm:text-xl text-white font-bold truncate">
          <span id="fastestName">-</span> 
          <span id="fastestTime" class="text-amber-400 text-base ml-2">(-)</span>
        </div>
      </div>
    </div>

    <!-- Wrapper Leaderboards -->
    <div class="leaderboards-wrapper smooth-layout">
      
      <!-- Leaderboard Kiri: 10 Siswa Tercepat & Benar -->
      <div class="fastest-container smooth-layout bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col">
        <h3 class="text-cyan-400 font-extrabold text-base sm:text-lg mb-3 flex items-center gap-2 border-b border-slate-700 pb-2.5 truncate">
          ⚡ TOP 10 TERCEPAT
        </h3>
        <ol id="fastestList" class="flex flex-col gap-2 overflow-y-auto max-h-[380px] pr-1">
          <li class="text-slate-400 text-center italic text-xs sm:text-sm py-4">Belum ada data</li>
        </ol>
      </div>

      <!-- Leaderboard Kanan: 10 Siswa Poin Tertinggi -->
      <div class="topscore-container smooth-layout bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col">
        <h3 class="text-amber-400 font-extrabold text-base sm:text-lg mb-3 flex items-center gap-2 border-b border-slate-700 pb-2.5 truncate">
          🏆 TOP 10 SKOR
        </h3>
        <ol id="leaderboardList" class="flex flex-col gap-2 overflow-y-auto max-h-[380px] pr-1">
          <li class="text-slate-400 text-center italic text-xs sm:text-sm py-4">Belum ada data</li>
        </ol>
      </div>

    </div>

  </div>

  <script>
    // Inisialisasi Pusher
    const pusher = new Pusher('a36b831383bbba2fdf2f', {
      cluster: 'ap1'
    });

    const roomId = "MATH123";
    const userId = "host-" + Math.floor(Math.random() * 10000);
    const channel = pusher.subscribe(`room-${roomId}`);

    document.getElementById('roomCodeDisplay').innerText = roomId;

    async function apiCall(action, payload = {}) {
      return fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, roomId, userId, ...payload })
      });
    }

    apiCall('create_room');

    function startQuiz() {
      document.getElementById('startBtn').style.display = 'none';
      apiCall('start_question');
    }

    channel.bind('new_question', (data) => {
      document.getElementById('questionBox').innerText = data.questionText;
      document.getElementById('categoryBadge').innerText = `${data.category} (${data.duration}s)`;
      document.getElementById('fastestName').innerText = "Menunggu jawaban...";
      document.getElementById('fastestTime').innerText = "-";

      const bar = document.getElementById('timerBar');
      bar.style.transition = 'none';
      bar.style.width = '100%';

      setTimeout(() => {
        bar.style.transition = `width ${data.duration}s linear`;
        bar.style.width = '0%';
      }, 50);

      setTimeout(() => {
        apiCall('process_results');
      }, data.duration * 1000);
    });

    channel.bind('round_results', (data) => {
      document.getElementById('fastestName').innerText = data.fastestName;
      document.getElementById('fastestTime').innerText = data.fastestTime;
      
      document.getElementById('categoryBadge').innerText = "⏳ Bersiap... Soal berikutnya dalam 5 detik!";
      document.getElementById('questionBox').innerText = `Jawaban: ${data.correctAnswer}`;

      // Render Papan Skor Tercepat
      const fastestListEl = document.getElementById('fastestList');
      fastestListEl.innerHTML = '';
      if (data.fastestList && data.fastestList.length > 0) {
        data.fastestList.slice(0, 10).forEach((item, idx) => {
          fastestListEl.innerHTML += `
            <li class="flex justify-between items-center bg-slate-700/50 p-2 sm:p-2.5 rounded-lg border border-slate-600/50 text-xs sm:text-sm">
              <span class="text-slate-200 font-medium truncate">${idx + 1}. ${item.name}</span>
              <span class="text-amber-400 font-bold bg-slate-900 px-2 py-0.5 rounded text-xs">${item.time}</span>
            </li>
          `;
        });
      } else if (data.fastestName && data.fastestName !== 'Tidak Ada') {
        fastestListEl.innerHTML = `
          <li class="flex justify-between items-center bg-indigo-950/60 p-2.5 rounded-lg border border-indigo-500/40 text-xs sm:text-sm">
            <span class="text-indigo-200 font-bold truncate">⚡ ${data.fastestName}</span>
            <span class="text-amber-400 font-bold bg-slate-900 px-2 py-0.5 rounded text-xs">${data.fastestTime}</span>
          </li>
        `;
      } else {
        fastestListEl.innerHTML = `<li class="text-slate-400 text-center italic text-xs sm:text-sm py-4">Tidak ada jawaban benar</li>`;
      }

      // Render Papan Skor Poin Tertinggi (dengan Ikon Medali)
      const list = document.getElementById('leaderboardList');
      list.innerHTML = '';
      data.leaderboard.forEach((player, idx) => {
        let medalIcon = '';
        let rankStyle = 'text-slate-200';
        let borderStyle = 'border-slate-600/50 bg-slate-700/50';

        if (idx === 0) {
          medalIcon = '<span class="text-base sm:text-lg">🥇</span> ';
          rankStyle = 'text-amber-300 font-extrabold';
          borderStyle = 'border-amber-500/50 bg-amber-950/30';
        } else if (idx === 1) {
          medalIcon = '<span class="text-base sm:text-lg">🥈</span> ';
          rankStyle = 'text-slate-200 font-bold';
          borderStyle = 'border-slate-400/50 bg-slate-800/60';
        } else if (idx === 2) {
          medalIcon = '<span class="text-base sm:text-lg">🥉</span> ';
          rankStyle = 'text-amber-600 font-bold';
          borderStyle = 'border-amber-700/50 bg-slate-800/60';
        } else {
          medalIcon = `<span class="text-slate-400 font-semibold w-5 inline-block">${idx + 1}.</span> `;
        }

        list.innerHTML += `
          <li class="flex justify-between items-center p-2 sm:p-2.5 rounded-lg border ${borderStyle} text-xs sm:text-sm transition-all">
            <div class="flex items-center gap-1.5 overflow-hidden">
              ${medalIcon}
              <span class="${rankStyle} truncate">${player.name}</span>
            </div>
            <strong class="${rankStyle} bg-slate-900 px-2.5 py-1 rounded-md text-xs">${player.score} p</strong>
          </li>
        `;
      });

      setTimeout(() => {
        apiCall('start_question');
      }, 5000);
    });
  </script>
</body>
</html>
